# Opt-in complete local ANPR engine. Run the explicit model setup first.
services:
  api:
    image: guivin:fast-alpr
    build:
      context: .
      dockerfile: deploy/Dockerfile.fast-alpr
    environment:
      GUIVIN_ANPR_BACKEND: fast_alpr
      GUIVIN_ANPR_MODEL_DIR: /models/fast-alpr
    volumes:
      - type: bind
        source: ./tmp/fast-alpr
        target: /models/fast-alpr
        read_only: true
        bind:
          create_host_path: false
